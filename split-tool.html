<!doctype html>
<meta charset="utf-8">
<title>Split DeutschFlow</title>
<h1>Split DeutschFlow</h1>
<p><input type="file" id="f"> <button id="an" type="button">Analyze</button> <button id="sp" type="button">Split</button></p>
<p>Rules JSON:</p>
<textarea id="ru" rows="14" cols="70">{"order":["js/config.js","js/data.js","js/supabase.js","js/pages/intro.js","js/pages/dangnhap.js","js/pages/dangki.js","js/pages/home.js","js/pages/learn.js","js/pages/vocab.js","js/pages/flashcards.js","js/pages/more.js","js/pages/account.js","js/pages/grammar.js","js/pages/dialogue.js","js/pages/quiz.js","js/pages/review.js","js/pages/exam.js","js/pages/store.js","js/pages/profile.js","js/app.js"],"bounds":[]}</textarea>
<pre id="o">ready</pre>
<div id="lk"></div>
<script>
let T="",JS="",CSS="";
const $=id=>document.getElementById(id);
f.onchange=e=>{let r=new FileReader();r.onload=()=>{T=r.result;parse();$("o").textContent="loaded "+T.length+" chars, css="+CSS.length+", js="+JS.length;};r.readAsText(e.target.files[0]);};
function parse(){
  let m=[...T.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)];CSS=m.map(x=>x[1]).join("\n");
  let s=[...T.matchAll(/<script([^>]*)>([\s\S]*?)<\/script>/gi)];
  JS=s.filter(x=>!/src\s*=/.test(x[1])).map(x=>x[2]).join("\n");
  window._srcs=s.filter(x=>/src\s*=/.test(x[1])).map(x=>x[1].trim());
}
an.onclick=()=>{
  if(!T){$("o").textContent="no file";return;}
  let L=T.split("\n"),out=[];
  out.push("chars="+T.length+" lines="+L.length+" cssChars="+CSS.length+" jsChars="+JS.length);
  out.push("src script tags: "+(window._srcs||[]).join(" | "));
  let jl=JS.split("\n");out.push("jsLines="+jl.length);
  out.push("--- BANNERS ---");
  jl.forEach((x,i)=>{let t=x.trim();if(t.length>4&&t.length<200&&/^(\/\/|\/\*)/.test(t)&&/(={3,}|-{3,}|PHẦN|SECTION|TRANG)/i.test(t))out.push((i+1)+": "+t.slice(0,180));});
  out.push("--- JS HEAD (first 10 lines) ---");
  jl.slice(0,10).forEach((x,i)=>out.push((i+1)+": "+x.slice(0,160)));
  out.push("--- JS TAIL (last 8 lines) ---");
  jl.slice(-8).forEach((x,i)=>out.push((jl.length-7+i)+": "+x.slice(0,160)));
  out.push("--- BRACE DEPTH AT BANNERS ---");
  let banners=[4,332,649,671,724,744,1065,1101,1131,1146,1228,1291,1318,1362,1387,1417,1497,1554,1609,1728,1835,1924,2011];
  let dep=0;jl.forEach((x,i)=>{let ln=i+1;if(banners.indexOf(ln)>=0){out.push("line "+ln+" depthBefore="+dep);}for(let c of x){if(c==="{")dep++;else if(c==="}")dep--;}});
  out.push("finalDepth="+dep);
  out.push("--- FUNCTION WORD (first 150, any indent) ---");
  let nf=0;jl.forEach((x,i)=>{let m=x.match(/function\s+([\w$]+)\s*\(/);if(m&&nf<150){out.push((i+1)+": ind"+((x.match(/^\s*/)||[""])[0].length)+" "+m[1]);nf++;}});
  out.push("--- METHOD STYLE name(args){ (first 150) ---");
  let nm=0;jl.forEach((x,i)=>{let m=x.match(/^\s*(?:async\s+)?([\w$]+)\s*\([^)]*\)\s*\{/);if(m&&nm<150&&!/^(if|for|while|switch|catch|function|return)$/.test(m[1])){out.push((i+1)+": ind"+((x.match(/^\s*/)||[""])[0].length)+" "+m[1]+"()");nm++;}});
  out.push("--- KEYWORD COUNTS ---");
  ["SUPABASE_URL","SUPABASE_ANON_KEY","createClient","LESSON","VOCAB","GRAMMAR","DIALOGUE","showPage","signIn","signUp","logout","flashcard","startExam","buyPackage","sync","initApp","currentUser","DEMO","addEventListener","DOMContentLoaded"].forEach(k=>{out.push(k+": "+(JS.split(k).length-1));});
  out.push("--- HTML page ids ---");
  [...T.matchAll(/id="([^"]+)"/g)].map(x=>x[1]).filter((v,i,a)=>a.indexOf(v)===i).forEach(id=>out.push("id: "+id));
  $("o").textContent=out.join("\n");
};
sp.onclick=()=>{
  if(!T){$("o").textContent="no file";return;}
  let R=JSON.parse($("ru").value);
  let files={};files["css/style.css"]=CSS;
  let jl=JS.split("\n");
  let offs=[0];for(let i=0;i<jl.length;i++){offs.push(offs[i]+jl[i].length+1);}
  let idx=R.bounds.map(b=>{let p;if(b.line!=null){p=offs[b.line-1];}else{p=JS.indexOf(b.m);}return {f:b.f,p:p};});
  let miss=idx.filter(x=>x.p<0||x.p==null);
  if(miss.length){$("o").textContent="MISSING MARKERS: "+miss.map(x=>x.f).join(", ");return;}
  idx.sort((a,b)=>a.p-b.p);
  let rep=["bounds: "+idx.map(x=>x.f+"@"+x.p).join(", ")];
  let pre=JS.slice(0,idx[0].p);
  rep.push("PRE chars="+pre.length+" | head: "+pre.slice(0,300).replace(/\n/g," / "));
  for(let i=0;i<idx.length;i++){let end=i+1<idx.length?idx[i+1].p:JS.length;files[idx[i].f]=JS.slice(idx[i].p,end);}
  files[idx[0].f]=pre+files[idx[0].f];
  let h=T;
  h=h.replace(/<style[^>]*>[\s\S]*?<\/style>/i,'<link rel="stylesheet" href="css/style.css">');
  h=h.replace(/<style[^>]*>[\s\S]*?<\/style>/gi,"");
  let tags=R.order.map(x=>'<script src="'+x+'"></'+'script>').join("\n");
  let done=false;
  h=h.replace(/<script(?![^>]*src)[^>]*>[\s\S]*?<\/script>/i,()=>{done=true;return tags;});
  h=h.replace(/<script(?![^>]*src)[^>]*>[\s\S]*?<\/script>/gi,"");
  if(!done){h=h.replace("</body>",tags+"\n</body>");}
  files["index.html"]=h;
  rep.push("FILES:");
  Object.keys(files).forEach(k=>rep.push(k+" = "+files[k].length+" chars"));
  let lk=$("lk");lk.innerHTML="";
  Object.keys(files).forEach(k=>{let b=new Blob([files[k]],{type:"text/plain"});let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=k.split("/").pop();a.textContent="DL "+k+" ("+files[k].length+")";a.style.display="block";lk.appendChild(a);});
  window._files=files;
  $("o").textContent=rep.join("\n");
};
</script>
